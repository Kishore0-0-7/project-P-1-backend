version: "3.9"

services:
  # ── PostgreSQL (local dev, use Neon in production) ────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opstriage
      POSTGRES_PASSWORD: opstriage
      POSTGRES_DB: opstriage
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opstriage"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://opstriage:opstriage@postgres/opstriage
      APP_ENV: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app   # live reload in dev

  # ── Nginx reverse proxy + 1-sec cache ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  pg_data:
