worker_processes auto;
worker_rlimit_nofile 65536;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  # ── Connection settings for high concurrency ──────────────────────────────
  keepalive_timeout       65;
  keepalive_requests      10000;
  reset_timedout_connection on;
  client_body_timeout     10;
  send_timeout            10;

  gzip              on;
  gzip_types        application/json text/plain;
  gzip_min_length   1000;

  upstream api {
    server api:8000;
    keepalive 64;   # persistent connections to FastAPI workers
  }

  server {
    listen 80;
    server_name _;

    # ── Health check passthrough (no cache) ────────────────────────────────
    location = /health {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API routes ──────────────────────────────────────────────────────────
    # Do not cache authenticated tenant data. Cache keys must never allow a
    # response for one bearer token or organization to reach another tenant.
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30;
    }

    # ── OpenAPI docs ───────────────────────────────────────────────────────
    location ~ ^/(docs|redoc|openapi.json) {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      }
  }
}
